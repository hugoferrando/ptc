<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier PTC</title>
<style>
  body { margin: 0; background: #f4f2ff; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .loader { text-align: center; color: #6c3fcf; font-size: 15px; }
  .dot-spin { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #ede8ff; border-top-color: #6c3fcf; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader">
  <div class="dot-spin"></div>
  Chargement…
</div>
<script>
  // Detect iOS or Android → mobile version, else → desktop version
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const isMobile = /android|iphone|ipad|ipod|mobile/i.test(ua) || window.innerWidth < 768;
  window.location.replace(isMobile ? 'mobile.html' : 'desktop.html');
</script>
</body>
</html>
